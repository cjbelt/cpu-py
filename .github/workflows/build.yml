name: Gerar Executável (Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.2'

    - name: Instalar Dependências de Interface do Linux
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Instalar Dependências do Projeto
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter psutil py_cpuinfo pyinstaller

    - name: Instalar WMI para Windows
      if: matrix.os == 'windows-latest'
      run: pip install wmi

    - name: Compilar para Windows com PyInstaller
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconsole --onefile --hidden-import=pywintypes --collect-all customtkinter main.py

    - name: Compilar para Linux com PyInstaller
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --noconsole --onefile --collect-all customtkinter main.py

    - name: Disponibilizar os Executáveis para Download
      uses: actions/upload-artifact@v4
      with:
        name: cpu-py-${{ matrix.os }}
        path: dist/
